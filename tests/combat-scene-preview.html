<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Combat scene preview · disposable game</title>
<style>html,body,iframe{margin:0;width:100%;height:100%;border:0;background:#0c1713}iframe{display:block}</style>
<iframe title="Combat preview"></iframe>
<script>
// Reuse the actual app and markup. The fixture disables persistence before load.
fetch('../index.html').then(r => r.text()).then(html => {
  html = html.replace('<head>', '<head><base href="../">');
  html = html.replace('</body>', '<script src="tests/combat-scene-preview.js"><' + '/script></body>');
  document.querySelector('iframe').srcdoc = html;
});
</script>
</html>
